<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TheDanceHouse Tainan - 空間洽詢</title>

  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg: #f8f9fc;
      --text-main: #1e2029;
      --text-sub: #6c7285;
      --accent: #4f46e5;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導覽列：俐落排版，杜絕擠壓 */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-block h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #111827;
    }

    .brand-block p {
      font-size: 0.72rem;
      color: var(--text-sub);
    }

    .header-ctrls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* LINE 資訊標籤 */
    .user-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f3f9;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .user-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-name {
      font-size: 0.78rem;
      color: var(--text-main);
      font-weight: 500;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 音樂跳動指示器 */
    .music-btn {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 16px;
      padding: 2px 4px;
      cursor: pointer;
    }

    .music-bar {
      width: 2.5px;
      height: 4px;
      background: #9ca3af;
      border-radius: 2px;
      transition: height 0.2s ease, background-color 0.3s;
    }

    .playing .music-bar {
      background: var(--accent);
    }

    .playing .bar-1 { animation: eqJump 0.8s infinite alternate ease-in-out; }
    .playing .bar-2 { animation: eqJump 0.6s infinite alternate ease-in-out 0.2s; }
    .playing .bar-3 { animation: eqJump 0.9s infinite alternate ease-in-out 0.4s; }

    @keyframes eqJump {
      0% { height: 4px; }
      100% { height: 16px; }
    }

    /* =========================================
       開場純文字模式（無任何卡牌感）
       ========================================= */
    #portal-view {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #fdfdfd;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 36px 30px;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    #portal-view.hidden-portal {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .portal-lead {
      font-size: 1.3rem;
      color: #111827;
      font-weight: 600;
      margin-bottom: 48px;
      letter-spacing: 0.03em;
    }

    .text-option-list {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .text-option {
      background: none;
      border: none;
      outline: none;
      text-align: left;
      cursor: pointer;
      padding: 0;
      position: relative;
    }

    .option-title {
      font-size: 1.25rem;
      font-weight: 500;
      color: #1e2029;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      transition: color 0.2s ease;
    }

    .option-title span.prefix {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
    }

    .option-desc {
      font-size: 0.88rem;
      color: #8c92a4;
      padding-left: 28px;
    }

    .text-option:active .option-title {
      color: var(--accent);
    }

    /* =========================================
       表單區域（俐落無厚框設計）
       ========================================= */
    main {
      flex: 1;
      padding: 30px 24px 60px;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }

    .form-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .plan-badge {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .form-header-bar h2 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #111827;
    }

    .switch-link {
      font-size: 0.85rem;
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #374151;
      font-weight: 500;
      margin-bottom: 8px;
    }

    label span {
      color: #ef4444;
      margin-left: 2px;
    }

    input, textarea {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 12px 14px;
      color: #111827;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    input::placeholder, textarea::placeholder {
      color: #9ca3af;
      font-size: 0.85rem;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.6;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 高相容性 CDN 優雅純鋼琴音訊 -->
  <audio id="bg-music" loop preload="auto" playsinline webkit-playsinline src="https://actions.google.com/sounds/v1/ambiences/daytime_forest_bonfire.ogg" style="display:none;"></audio>

  <!-- 頂部資訊列 -->
  <header>
    <div class="brand-block">
      <h1>THEDANCEHOUSE</h1>
      <p>舞的店 ‧ 空間洽詢</p>
    </div>

    <div class="header-ctrls">
      <div class="user-pill">
        <img id="user-avatar" class="user-avatar hidden" alt="LINE Avatar">
        <span id="user-name" class="user-name">訪客</span>
      </div>

      <div id="music-btn" class="music-btn" onclick="toggleMusic()">
        <div class="music-bar bar-1"></div>
        <div class="music-bar bar-2"></div>
        <div class="music-bar bar-3"></div>
      </div>
    </div>
  </header>

  <!-- 1. 純文字開場問答（零卡牌感） -->
  <div id="portal-view">
    <div class="portal-lead">請問您是：</div>

    <div class="text-option-list">
      <div class="text-option" onclick="selectType('regular')">
        <div class="option-title">
          <span class="prefix">A.</span> 固定借用申請
        </div>
        <div class="option-desc">常態授課班級、固定每週排練、系列專案合作</div>
      </div>

      <div class="text-option" onclick="selectType('rental')">
        <div class="option-title">
          <span class="prefix">B.</span> 空間想要出借
        </div>
        <div class="option-desc">舞蹈教室租借、短期排練團練、活動攝影場地</div>
      </div>
    </div>
  </div>

  <!-- 2. 表單區域 -->
  <main>
    <div class="form-header-bar">
      <div>
        <div id="display-plan-tag" class="plan-badge">OPTION A</div>
        <h2 id="display-plan-title">固定借用申請</h2>
      </div>
      <span class="switch-link" onclick="togglePlan()">切換類型</span>
    </div>

    <form id="inquiry-form" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="contact-name">聯絡姓名 / 稱謂<span>*</span></label>
        <input type="text" id="contact-name" required placeholder="例如：Jimmy">
      </div>

      <div class="form-group">
        <label for="contact-phone">聯絡電話<span>*</span></label>
        <input type="tel" id="contact-phone" required placeholder="例如：0910-076-252">
      </div>

      <!-- 動態欄位：固定借用 -->
      <div id="field-regular" class="form-group">
        <label for="regular-schedule">預計授課 / 排練時段<span>*</span></label>
        <input type="text" id="regular-schedule" placeholder="例如：每週二 19:00 - 21:00，預計租借 3 個月">
      </div>

      <!-- 動態欄位：空間出借 -->
      <div id="field-rental" class="form-group hidden">
        <label for="rental-detail">預計出借日期、時段與用途<span>*</span></label>
        <input type="text" id="rental-detail" placeholder="例如：10/25 (日) 14:00-17:00，舞團排練">
      </div>

      <div class="form-group">
        <label for="activity-scale">課程性質 / 預估人數</label>
        <input type="text" id="activity-scale" placeholder="例如：成人國標進階班，約 8-12 人">
      </div>

      <div class="form-group">
        <label for="notes">其他備註與需求細節</label>
        <textarea id="notes" rows="3" placeholder="如有任何特殊預算考量或問題歡迎填寫"></textarea>
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">確認送出洽詢</button>
    </form>
  </main>

  <script>
    const LIFF_ID = '2011761541-H6wrNahH';
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyV6fclFzpwv5uUGWCb1GPcNrE7s6ETXmS7I-R6RUhiSBd/exec';

    // 換上直連純鋼琴音軌（來自 Google 免版權音訊資源，無防盜鏈問題）
    const PIANO_MUSIC_URL = 'https://actions.google.com/sounds/v1/musical_tracks/piano_ballad.mp3';

    let currentType = 'regular'; // 'regular' 或 'rental'
    let isMusicPlaying = false;
    let audioInstance = null;
    let currentUser = {
      userId: '',
      displayName: '訪客',
      pictureUrl: ''
    };

    window.addEventListener('DOMContentLoaded', () => {
      initAudio();
      initLIFF();
    });

    function initAudio() {
      audioInstance = document.getElementById('bg-music');
      audioInstance.src = PIANO_MUSIC_URL;
      audioInstance.load();
    }

    /* 點選文字選項直接進入 */
    function selectType(type) {
      currentType = type;
      renderView();

      // 淡出全螢幕純文字選單
      document.getElementById('portal-view').classList.add('hidden-portal');

      // 嚴格利用點擊瞬間的手勢播放音樂
      playMusicDirectly();
    }

    function togglePlan() {
      currentType = (currentType === 'regular') ? 'rental' : 'regular';
      renderView();
    }

    function renderView() {
      const tag = document.getElementById('display-plan-tag');
      const title = document.getElementById('display-plan-title');
      const regularGroup = document.getElementById('field-regular');
      const rentalGroup = document.getElementById('field-rental');
      const regularInput = document.getElementById('regular-schedule');
      const rentalInput = document.getElementById('rental-detail');

      if (currentType === 'regular') {
        tag.textContent = 'OPTION A';
        title.textContent = '固定借用申請';
        regularGroup.classList.remove('hidden');
        rentalGroup.classList.add('hidden');
        regularInput.required = true;
        rentalInput.required = false;
      } else {
        tag.textContent = 'OPTION B';
        title.textContent = '空間想要出借';
        regularGroup.classList.add('hidden');
        rentalGroup.classList.remove('hidden');
        regularInput.required = false;
        rentalInput.required = true;
      }
    }

    /* 播放音樂 */
    function playMusicDirectly() {
      if (!audioInstance) return;
      audioInstance.play().then(() => {
        isMusicPlaying = true;
        document.getElementById('music-btn').classList.add('playing');
      }).catch(err => {
        console.warn('音訊播放提示：', err);
      });
    }

    function toggleMusic() {
      const btn = document.getElementById('music-btn');
      if (!audioInstance) return;

      if (isMusicPlaying) {
        audioInstance.pause();
        isMusicPlaying = false;
        btn.classList.remove('playing');
      } else {
        audioInstance.play();
        isMusicPlaying = true;
        btn.classList.add('playing');
      }
    }

    /* LINE 帳號資料載入 */
    async function initLIFF() {
      const nameEl = document.getElementById('user-name');
      const avatarEl = document.getElementById('user-avatar');
      const nameInput = document.getElementById('contact-name');

      try {
        if (typeof liff === 'undefined') return;
        await liff.init({ liffId: LIFF_ID });

        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          if (profile) {
            currentUser.userId = profile.userId;
            currentUser.displayName = profile.displayName || 'LINE 用戶';
            currentUser.pictureUrl = profile.pictureUrl || '';

            nameEl.textContent = currentUser.displayName;
            if (currentUser.pictureUrl) {
              avatarEl.src = currentUser.pictureUrl;
              avatarEl.classList.remove('hidden');
            }

            if (nameInput && !nameInput.value) {
              nameInput.value = currentUser.displayName;
            }
          }
        }
      } catch (e) {
        console.error('LIFF 初始化失敗：', e);
      }
    }

    /* 送出表單到試算表 (GAS) */
    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '送出中...';

      const scheduleValue = (currentType === 'regular')
        ? document.getElementById('regular-schedule').value
        : document.getElementById('rental-detail').value;

      const payload = {
        plan: (currentType === 'regular') ? 'A. 固定借用申請' : 'B. 空間想要出借',
        lineUserId: currentUser.userId || 'guest_user',
        lineDisplayName: currentUser.displayName || '訪客',
        contactName: document.getElementById('contact-name').value,
        contactPhone: document.getElementById('contact-phone').value,
        scheduleOrDetail: scheduleValue,
        activityScale: document.getElementById('activity-scale').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert('洽詢已成功送出！專員將透過 LINE 或電話與您聯繫。');
        if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
          liff.closeWindow();
        }
      } catch (err) {
        alert('連線逾時，請重試或私訊粉專。');
      } finally {
        btn.disabled = false;
        btn.textContent = '確認送出洽詢';
      }
    }
  </script>
</body>
</html>
