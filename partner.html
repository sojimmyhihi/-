<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TheDanceHouse Tainan - 專案合作與長期租借</title>

  <!-- Tailwind CSS & LINE LIFF SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 典雅襯線字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Serif TC', 'Cormorant Garamond', Georgia, serif;
    }
    .font-eng-serif {
      font-family: 'Cinzel', serif;
    }
    .marble-bg {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 10% 20%, rgba(226, 232, 240, 0.6) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(203, 213, 225, 0.5) 0px, transparent 55%),
        linear-gradient(125deg, transparent 40%, rgba(212, 175, 55, 0.08) 47%, rgba(255, 255, 255, 0.9) 50%, transparent 53%),
        radial-gradient(circle at 50% 50%, #ffffff 0%, #f1f5f9 100%);
    }
    @keyframes elegantPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.98); }
    }
    .pulse-touch {
      animation: elegantPulse 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .music-spin {
      animation: slowSpin 8s linear infinite;
    }
    .fade-transition {
      transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16 antialiased selection:bg-amber-100">

 <!-- 背景鋼琴音樂（已換為優雅法式純鋼琴曲） -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://actions.google.com/sounds/v1/musical_tracks/piano_ballad.mp3" type="audio/mp3">
  </audio>

  <!-- 1. 開場優雅大理石封面 -->
  <div id="splash-screen" class="fixed inset-0 z-50 marble-bg flex flex-col justify-between items-center py-16 px-6 fade-transition cursor-pointer select-none">
    <div class="w-full flex justify-center pt-8">
      <div class="h-0.5 w-12 bg-amber-400/60 tracking-widest"></div>
    </div>
    <div class="text-center space-y-4">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-amber-300/60 bg-amber-50/50 backdrop-blur-sm text-[11px] font-medium tracking-[0.25em] text-amber-800 uppercase font-eng-serif">
        Tainan Dance Studio
      </div>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-wider">
        TheDanceHouse<br><span class="text-2xl text-amber-900 font-normal">Tainan</span>
      </h1>
      <p class="text-xs text-slate-500 font-eng-serif tracking-[0.35em] uppercase">
        Partnership & Long-Term Rental
      </p>
      <div class="pt-2 flex justify-center">
        <span class="inline-block w-8 h-[1px] bg-slate-300"></span>
      </div>
    </div>
    <div class="text-center space-y-2 pulse-touch pb-6">
      <p class="text-sm font-bold text-slate-700 tracking-widest">點擊開啟體驗</p>
      <p class="text-[10px] font-eng-serif tracking-[0.3em] uppercase text-slate-400">TOUCH TO START</p>
    </div>
  </div>

  <!-- 2. 身分確認過場動畫 -->
  <div id="auth-loading-screen" class="fixed inset-0 z-40 bg-white/95 backdrop-blur-md flex flex-col items-center justify-center p-6 space-y-5 fade-transition hidden">
    <div class="relative w-16 h-16">
      <div class="absolute inset-0 rounded-full border-2 border-amber-200 border-t-amber-600 animate-spin"></div>
      <div class="absolute inset-2 rounded-full border-2 border-slate-100 border-b-slate-400 animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
    </div>
    <div class="text-center space-y-1">
      <p class="text-sm font-bold text-slate-800 tracking-wider">身分驗證中</p>
      <p class="text-[10px] font-eng-serif text-slate-400 tracking-widest uppercase">Connecting to TheDanceHouse...</p>
    </div>
  </div>

  <!-- 3. 開場純文字二選一選單（無粗重方框卡牌感） -->
  <div id="portal-view" class="fixed inset-0 z-30 marble-bg flex flex-col justify-center px-8 sm:px-12 fade-transition hidden">
    <div class="max-w-md mx-auto w-full space-y-10">
      <div class="space-y-2">
        <div class="inline-block px-2.5 py-0.5 rounded-full border border-amber-300/80 bg-amber-50 text-[10px] font-bold tracking-widest text-amber-800 uppercase font-eng-serif">
          COOPERATION
        </div>
        <h2 class="text-2xl font-black text-slate-900 tracking-wide">請問您的洽詢方向是：</h2>
        <p class="text-xs text-slate-500">點選下方文字項目，直接展開專屬洽詢表單</p>
      </div>

      <div class="space-y-8 pt-2">
        <!-- 選項 A -->
        <button onclick="selectOption('regular')" class="w-full text-left group block focus:outline-none">
          <div class="flex items-baseline gap-3">
            <span class="text-xl font-black text-amber-700 font-eng-serif group-hover:text-amber-600 transition">A.</span>
            <div class="space-y-1 border-b border-transparent group-hover:border-amber-400 pb-1 transition">
              <h3 class="text-lg font-bold text-slate-900 group-hover:text-amber-900 transition">長期固定借用申請</h3>
              <p class="text-xs text-slate-500 leading-relaxed">每週固定時段授課、常態班級、系列工作坊長期合作</p>
            </div>
          </div>
        </button>

        <!-- 選項 B -->
        <button onclick="selectOption('space_share')" class="w-full text-left group block focus:outline-none">
          <div class="flex items-baseline gap-3">
            <span class="text-xl font-black text-amber-700 font-eng-serif group-hover:text-amber-600 transition">B.</span>
            <div class="space-y-1 border-b border-transparent group-hover:border-amber-400 pb-1 transition">
              <h3 class="text-lg font-bold text-slate-900 group-hover:text-amber-900 transition">我有空間想要釋出合作</h3>
              <p class="text-xs text-slate-500 leading-relaxed">現有舞蹈教室或場地，委託舞的店代為營運與排程出借</p>
            </div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- 4. 主介面 Header（維持精緻雙欄排版，不跑版） -->
  <header class="marble-bg text-slate-800 pt-5 pb-5 px-5 shadow-sm rounded-b-3xl border-b border-slate-300/80 sticky top-0 z-20 overflow-hidden">
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200"></div>

    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="space-y-0.5">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
          <h1 class="text-lg font-black tracking-wide text-slate-900 font-eng-serif">TheDanceHouse</h1>
        </div>
        <p class="text-[9px] text-slate-500 font-bold tracking-[0.2em] uppercase">
          舞的店 · 專案合作洽詢
        </p>
      </div>

      <div class="flex items-center gap-3">
        <!-- 音樂切換旋鈕 -->
        <button id="toggle-music-btn" class="w-8 h-8 rounded-full bg-white/95 backdrop-blur-md shadow-sm border border-slate-200 flex items-center justify-center text-slate-600 hover:text-amber-600 active:scale-90 transition">
          <span id="music-icon" class="text-xs">🎵</span>
        </button>

        <!-- LINE 使用者標籤 -->
        <div class="flex items-center gap-2 bg-white/95 backdrop-blur-md px-2.5 py-1.5 rounded-full border border-slate-300 shadow-sm">
          <img id="user-avatar" src="https://via.placeholder.com/28" class="w-6 h-6 rounded-full object-cover hidden border border-slate-200" alt="Avatar">
          <div class="text-left">
            <span id="user-display" class="block text-xs font-bold text-slate-800 max-w-[80px] truncate">訪客</span>
            <span id="verify-badge" class="block text-[8px] text-amber-600 font-semibold">LINE 連線</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 5. 核心表單主體 -->
  <main class="max-w-md mx-auto p-4 space-y-4 pt-6">
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/90 space-y-6">
      
      <!-- 頂部方案切換條 -->
      <div class="flex justify-between items-baseline border-b border-slate-100 pb-3">
        <div>
          <span id="form-type-badge" class="text-[10px] font-bold text-amber-800 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-md font-eng-serif">
            OPTION A
          </span>
          <h2 id="form-type-title" class="text-lg font-black text-slate-900 mt-1">長期固定借用申請</h2>
        </div>
        <button type="button" onclick="switchOption()" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 transition underline underline-offset-4">
          切換方案
        </button>
      </div>

      <form id="partner-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
        
        <!-- 【共同欄位】 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">真實姓名 / 稱謂 <span class="text-rose-500">*</span></label>
          <input type="text" id="contact-name" required placeholder="例如：黃老師 / Jimmy" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">聯絡手機號碼 <span class="text-rose-500">*</span></label>
          <input type="tel" id="contact-phone" required placeholder="例如：0910-076-252" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">LINE ID（便於專員回覆聯繫）<span class="text-rose-500">*</span></label>
          <input type="text" id="contact-lineid" required placeholder="請填寫您的 LINE ID 或留「同電話」" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <!-- 【選項 A 專屬欄位】 -->
        <div id="section-regular" class="space-y-4 pt-2 border-t border-slate-100">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">預計授課 / 排練時段 <span class="text-rose-500">*</span></label>
            <input type="text" id="regular-schedule" placeholder="例如：每週二晚上 19:00 - 21:00" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">課程性質 / 舞風 <span class="text-rose-500">*</span></label>
            <input type="text" id="regular-style" placeholder="例如：成人國標拉丁、現代舞、兒童律動" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">預估每堂人數</label>
              <input type="text" id="regular-students" placeholder="例如：8 - 12 人" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">預計合作起訖月份</label>
              <input type="text" id="regular-months" placeholder="例如：2026/11 起半年" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
          </div>
        </div>

        <!-- 【選項 B 專屬欄位】 -->
        <div id="section-space" class="space-y-4 pt-2 border-t border-slate-100 hidden">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">空間名稱 / 所在區域 <span class="text-rose-500">*</span></label>
            <input type="text" id="space-location" placeholder="例如：舞藝中心 / 台南市東區東榮街" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">空間坪數 <span class="text-rose-500">*</span></label>
              <input type="text" id="space-size" placeholder="例如：約 25 坪" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">地面材質 <span class="text-rose-500">*</span></label>
              <input type="text" id="space-floor" placeholder="例如：專業彈性木地板" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">現有硬體設備</label>
            <input type="text" id="space-equipment" placeholder="例如：全面鏡牆、獨立藍牙音響、分離式冷氣" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">期望合作模式 <span class="text-rose-500">*</span></label>
            <select id="space-mode" class="w-full border border-slate-300 bg-white rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none">
              <option value="全權代管營運（排程、客服與出借門禁由舞的店統籌）">全權代管營運（排程、客服與出借門禁由舞的店統籌）</option>
              <option value="閒置時段分潤媒合（空間自主管理，僅媒合班級租借）">閒置時段分潤媒合（空間自主管理，僅媒合班級租借）</option>
              <option value="其他客製化合作模式">其他客製化合作模式（面議洽談）</option>
            </select>
          </div>
        </div>

        <!-- 補充留言 -->
        <div class="pt-2">
          <label class="block text-xs font-bold text-slate-500 mb-1">其他備註或特殊考量（選填）</label>
          <textarea id="notes" rows="3" placeholder="例如：設備進駐需求、預算規劃或其他想先了解的事項" class="w-full border border-slate-300 rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-amber-300 font-bold text-sm tracking-wider shadow-md active:scale-95 transition">
          確認送出洽詢意向 →
        </button>
      </form>
    </div>
  </main>

  <script>
    const LIFF_ID = '2011761541-H6wrNahH'; // 沿用已通過測試的 LIFF ID
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyV6fcIFzpwv5uUGWCb1GPcNrE7s6ETXmS7I-R6RUhiSBdhqRlSUoVomtzyFefSo7bDEg/exec';

    let currentOption = 'regular'; // 'regular' (A) 或 'space_share' (B)
    let isMusicPlaying = false;
    let currentUser = {
      userId: 'guest_user',
      lineName: '訪客',
      pictureUrl: ''
    };

    window.addEventListener('DOMContentLoaded', () => {
      setupCoverAndAudio();
    });

    /* 1. 封面手勢解鎖音訊與 LIFF 初始化流程 */
    function setupCoverAndAudio() {
      const splash = document.getElementById('splash-screen');
      const authLoading = document.getElementById('auth-loading-screen');
      const portal = document.getElementById('portal-view');
      const audio = document.getElementById('bg-music');
      const toggleBtn = document.getElementById('toggle-music-btn');
      const musicIcon = document.getElementById('music-icon');

      splash.addEventListener('click', async () => {
        // 利用封面真實手勢解鎖音訊
        try {
          audio.volume = 0.45;
          await audio.play();
          isMusicPlaying = true;
          toggleBtn.classList.add('music-spin');
        } catch (err) {
          console.warn('音訊播放受限：', err);
        }

        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(() => splash.classList.add('hidden'), 800);

        authLoading.classList.remove('hidden');
        authLoading.style.opacity = '1';

        await initLineAuth();

        setTimeout(() => {
          authLoading.style.opacity = '0';
          setTimeout(() => {
            authLoading.classList.add('hidden');
            portal.classList.remove('hidden'); // 展開純文字二選一
          }, 600);
        }, 600);
      });

      // 右上角音樂按鈕切換
      toggleBtn.addEventListener('click', () => {
        if (isMusicPlaying) {
          audio.pause();
          isMusicPlaying = false;
          toggleBtn.classList.remove('music-spin');
          musicIcon.textContent = '🔈';
        } else {
          audio.play();
          isMusicPlaying = true;
          toggleBtn.classList.add('music-spin');
          musicIcon.textContent = '🎵';
        }
      });
    }

    /* 2. LIFF 帳號資訊讀取 */
    async function initLineAuth() {
      try {
        if (typeof liff === 'undefined') return;
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        if (profile && profile.userId) {
          currentUser.userId = profile.userId;
          currentUser.lineName = profile.displayName || 'LINE 用戶';
          currentUser.pictureUrl = profile.pictureUrl || '';

          document.getElementById('user-display').textContent = profile.displayName;
          document.getElementById('verify-badge').textContent = '已認證';
          document.getElementById('verify-badge').className = 'block text-[8px] text-emerald-600 font-semibold';

          if (profile.pictureUrl) {
            const img = document.getElementById('user-avatar');
            img.src = profile.pictureUrl;
            img.classList.remove('hidden');
          }

          const contactNameInput = document.getElementById('contact-name');
          if (contactNameInput && !contactNameInput.value) {
            contactNameInput.value = profile.displayName;
          }
        }
      } catch (err) {
        console.warn('LINE LIFF 外部載入：', err);
      }
    }

    /* 3. 點擊開場文字選項直接進入表單 */
    function selectOption(optionKey) {
      currentOption = optionKey;
      renderFormFields();

      const portal = document.getElementById('portal-view');
      portal.style.opacity = '0';
      portal.style.pointerEvents = 'none';
      setTimeout(() => portal.classList.add('hidden'), 600);
    }

    /* 4. 切換選項方案（Option A / Option B） */
    function switchOption() {
      currentOption = (currentOption === 'regular') ? 'space_share' : 'regular';
      renderFormFields();
    }

    function renderFormFields() {
      const badge = document.getElementById('form-type-badge');
      const title = document.getElementById('form-type-title');
      const secRegular = document.getElementById('section-regular');
      const secSpace = document.getElementById('section-space');

      const regularSchedule = document.getElementById('regular-schedule');
      const regularStyle = document.getElementById('regular-style');
      const spaceLocation = document.getElementById('space-location');
      const spaceSize = document.getElementById('space-size');
      const spaceFloor = document.getElementById('space-floor');

      if (currentOption === 'regular') {
        badge.textContent = 'OPTION A';
        title.textContent = '長期固定借用申請';
        secRegular.classList.remove('hidden');
        secSpace.classList.add('hidden');

        regularSchedule.required = true;
        regularStyle.required = true;
        spaceLocation.required = false;
        spaceSize.required = false;
        spaceFloor.required = false;
      } else {
        badge.textContent = 'OPTION B';
        title.textContent = '我有空間想要釋出合作';
        secRegular.classList.add('hidden');
        secSpace.classList.remove('hidden');

        regularSchedule.required = false;
        regularStyle.required = false;
        spaceLocation.required = true;
        spaceSize.required = true;
        spaceFloor.required = true;
      }
    }

    /* 5. 表單送出資料至 GAS 試算表 */
    async function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = '資料送出中...';

      const payload = {
        action: 'createPartnerInquiry',
        inquiry_type: (currentOption === 'regular') ? 'A. 長期固定借用' : 'B. 空間釋出合作',
        line_user_id: currentUser.userId,
        line_display_name: currentUser.lineName,
        contact_name: document.getElementById('contact-name').value.trim(),
        contact_phone: document.getElementById('contact-phone').value.trim(),
        contact_line_id: document.getElementById('contact-lineid').value.trim(),
        notes: document.getElementById('notes').value.trim(),

        // 選項 A 專屬資料
        schedule: (currentOption === 'regular') ? document.getElementById('regular-schedule').value.trim() : '',
        dance_style: (currentOption === 'regular') ? document.getElementById('regular-style').value.trim() : '',
        students_count: (currentOption === 'regular') ? document.getElementById('regular-students').value.trim() : '',
        cooperate_months: (currentOption === 'regular') ? document.getElementById('regular-months').value.trim() : '',

        // 選項 B 專屬資料
        space_location: (currentOption === 'space_share') ? document.getElementById('space-location').value.trim() : '',
        space_size: (currentOption === 'space_share') ? document.getElementById('space-size').value.trim() : '',
        space_floor: (currentOption === 'space_share') ? document.getElementById('space-floor').value.trim() : '',
        space_equipment: (currentOption === 'space_share') ? document.getElementById('space-equipment').value.trim() : '',
        space_mode: (currentOption === 'space_share') ? document.getElementById('space-mode').value : ''
      };

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        alert(`【${payload.inquiry_type}】意向已成功送出！\n\n專員將透過 LINE 或電話與您進一步聯繫。感謝您的支持！`);
        
        if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
          liff.closeWindow();
        } else {
          location.reload();
        }
      } catch (err) {
        alert('連線異常，請確認網路連線或直接私訊粉專聯繫。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '確認送出洽詢意向 →';
      }
    }
  </script>
