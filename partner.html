<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>體驗空間</title>

  <!-- 1. 載入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部狀態列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #c5a059;
      object-fit: cover;
    }

    .hidden {
      display: none;
    }

    /* 音樂控制器 */
    .music-control {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      user-select: none;
    }

    .eq-visual {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
      transition: opacity 0.3s ease;
    }

    .eq-visual span {
      width: 3px;
      height: 4px;
      background-color: #c5a059;
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .opacity-40 {
      opacity: 0.4;
    }

    /* 等化器跳動動畫 */
    .eq-bar-1 { animation: eqJump 0.8s ease-in-out infinite alternate; }
    .eq-bar-2 { animation: eqJump 0.6s ease-in-out infinite alternate 0.2s; }
    .eq-bar-3 { animation: eqJump 0.9s ease-in-out infinite alternate 0.4s; }

    @keyframes eqJump {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    /* 開場全螢幕遮罩：大理石紋理 + 沉浸暗色漸層 */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      background: 
        radial-gradient(circle at center, rgba(15, 15, 15, 0.75) 0%, rgba(5, 5, 5, 0.95) 100%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 8px),
        linear-gradient(135deg, #1c1c1c 0%, #2a2a2a 50%, #181818 100%);
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    #splash-screen.splash-exit {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 呼吸燈核心 */
    .breathing-core {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .breathing-light {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle, #e2c17c 0%, rgba(197, 160, 89, 0.2) 70%, transparent 100%);
      box-shadow: 0 0 25px rgba(226, 193, 124, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.8);
      animation: breathe 3s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(0.9);
        box-shadow: 0 0 15px rgba(226, 193, 124, 0.3);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.15);
        box-shadow: 0 0 45px rgba(226, 193, 124, 0.9);
        opacity: 1;
      }
    }

    .splash-text {
      font-size: 0.95rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #c5a059;
      animation: breathe 3s ease-in-out infinite;
    }

    /* 主頁面內容區塊 */
    main {
      padding: 40px 24px;
      max-width: 600px;
      margin: 0 auto;
    }

    .form-group {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input[type="text"] {
      padding: 12px 16px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- 背景音訊（請替換 src 音訊檔路徑） -->
 <audio id="bg-music" loop preload="auto" src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=piano-moment-9835.mp3"></audio>

  <!-- 開場畫面遮罩 -->
  <div id="splash-screen">
    <div class="breathing-core">
      <div class="breathing-light"></div>
      <div class="splash-text">TOUCH TO ENTER</div>
    </div>
  </div>

  <!-- 頂部資訊列 -->
  <header>
    <div class="user-profile">
      <img id="user-avatar" class="user-avatar hidden" alt="Avatar">
      <span id="user-name">連線中...</span>
    </div>

    <div id="music-toggle-btn" class="music-control">
      <div id="eq-visual" class="eq-visual opacity-40">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span id="music-label" style="font-size: 0.8rem; letter-spacing: 0.05em;">BGM OFF</span>
    </div>
  </header>

  <!-- 核心展示頁面 -->
  <main>
    <h2>專屬預約體驗</h2>
    <div class="form-group">
      <label for="inquiry-name">聯絡姓名</label>
      <input type="text" id="inquiry-name" placeholder="讀取中...">
    </div>
  </main>

  <script>
    const LIFF_ID = '2011761541-H6wrNahH';
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyV6fcIFzpwv5uUGWCb1GPcNrE7s6ETXmS7I-R6RUhiSBdhqRlSUoVomtzyFefSo7bDEg/exec';

    let currentSelectedCategory = 'regular_rent';
    let isMusicPlaying = false;
    let currentUser = {
      userId: 'guest_user',
      displayName: '訪客',
      pictureUrl: ''
    };

    window.addEventListener('DOMContentLoaded', () => {
      initMusicToggle();

      const splash = document.getElementById('splash-screen');
      if (splash) {
        // 單獨使用 click 處理點擊與手機點觸，防止 touchstart + click 雙發
        splash.addEventListener('click', startExperience);
      }

      // 預先載入 LIFF，在背景初始化
      initLIFF();
    });

    function startExperience() {
      const splash = document.getElementById('splash-screen');
      if (!splash || splash.classList.contains('splash-exit')) return;

      splash.classList.add('splash-exit');
      setTimeout(() => {
        splash.style.display = 'none';
      }, 700);

      // 使用者互動當下啟動音訊，相容瀏覽器自動播放政策
      playMusic();

      // 若在外部瀏覽器未登入且需要綁定帳號，在此觸發授權
      if (typeof liff !== 'undefined' && liff.isLoggedIn && !liff.isLoggedIn()) {
        liff.login();
      }
    }

    function playMusic() {
      const audio = document.getElementById('bg-music');
      const label = document.getElementById('music-label');
      const visual = document.getElementById('eq-visual');
      if (!audio) return;

      audio.play().then(() => {
        isMusicPlaying = true;
        if (label) label.textContent = 'PLAYING';
        if (visual) {
          visual.classList.remove('opacity-40');
          const bars = visual.querySelectorAll('span');
          bars.forEach((bar, idx) => bar.classList.add(`eq-bar-${idx + 1}`));
        }
      }).catch(err => {
        console.warn('音訊播放受阻（可能受限於瀏覽器安全政策）：', err);
      });
    }

    function initMusicToggle() {
      const audio = document.getElementById('bg-music');
      const btn = document.getElementById('music-toggle-btn');
      const label = document.getElementById('music-label');
      const visual = document.getElementById('eq-visual');

      if (!btn || !audio) return;

      btn.addEventListener('click', () => {
        if (isMusicPlaying) {
          audio.pause();
          isMusicPlaying = false;
          if (label) label.textContent = 'BGM OFF';
          if (visual) {
            visual.classList.add('opacity-40');
            const bars = visual.querySelectorAll('span');
            bars.forEach((bar, idx) => bar.classList.remove(`eq-bar-${idx + 1}`));
          }
        } else {
          playMusic();
        }
      });
    }

    async function initLIFF() {
      const userNameEl = document.getElementById('user-name');
      try {
        if (typeof liff === 'undefined') {
          console.warn('LIFF SDK 尚未載入');
          return;
        }

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          if (userNameEl) userNameEl.textContent = '訪客 (未登入)';
          return;
        }

        const profile = await liff.getProfile();
        if (profile && profile.userId) {
          currentUser.userId = profile.userId;
          currentUser.displayName = profile.displayName || 'LINE 用戶';
          currentUser.pictureUrl = profile.pictureUrl || '';

          if (userNameEl) userNameEl.textContent = currentUser.displayName;

          if (currentUser.pictureUrl) {
            const avatar = document.getElementById('user-avatar');
            if (avatar) {
              avatar.src = currentUser.pictureUrl;
              avatar.classList.remove('hidden');
            }
          }

          const nameInput = document.getElementById('inquiry-name');
          if (nameInput && !nameInput.value) {
            nameInput.value = currentUser.displayName;
          }
        }
      } catch (err) {
        console.error('LIFF 初始化失敗：', err);
        if (userNameEl) userNameEl.textContent = '連線失敗';
      }
    }
  </script>
</body>
</html>
