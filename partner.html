<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TheDanceHouse Tainan - 空間洽詢</title>

  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg: #0d0f14;
      --card-bg: rgba(22, 25, 35, 0.7);
      --accent: #8b5cf6;
      --accent-light: #c4b5fd;
      --text-main: #f1f3f9;
      --text-sub: #9499ad;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 40%);
    }

    /* 頂部 Header：簡潔自適應，不擠壓 */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 15, 20, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-block h1 {
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: #fff;
    }

    .brand-block p {
      font-size: 0.7rem;
      color: var(--text-sub);
      letter-spacing: 0.05em;
    }

    .header-ctrls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 使用者小標籤 */
    .user-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 20px;
    }

    .user-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-name {
      font-size: 0.75rem;
      color: var(--text-main);
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 音樂指示波形 */
    .music-btn {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 28px;
      padding: 0 8px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .music-bar {
      width: 2.5px;
      height: 4px;
      background: var(--accent-light);
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .playing .bar-1 { animation: jump 0.8s infinite alternate ease-in-out; }
    .playing .bar-2 { animation: jump 0.6s infinite alternate ease-in-out 0.2s; }
    .playing .bar-3 { animation: jump 0.9s infinite alternate ease-in-out 0.4s; }

    @keyframes jump {
      0% { height: 4px; }
      100% { height: 14px; }
    }

    /* 開場全螢幕二選一門戶 */
    #portal-view {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #0d0f14;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    #portal-view.hidden-portal {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .portal-subtitle {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--accent-light);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .portal-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 32px;
    }

    .choice-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .choice-card {
      background: linear-gradient(145deg, rgba(26, 29, 41, 0.85), rgba(17, 20, 29, 0.95));
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 24px 20px;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .choice-card:active {
      transform: scale(0.98);
      border-color: var(--accent);
    }

    .choice-tag {
      font-size: 0.7rem;
      color: var(--accent-light);
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .choice-card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }

    .choice-card p {
      font-size: 0.8rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    /* 表單頁面 */
    main {
      flex: 1;
      padding: 24px 20px 48px;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }

    .form-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .plan-tag {
      font-size: 0.75rem;
      color: var(--accent-light);
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .form-header-bar h2 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #fff;
      margin-top: 4px;
    }

    .switch-link {
      font-size: 0.8rem;
      color: var(--accent-light);
      text-decoration: underline;
      cursor: pointer;
      padding-bottom: 2px;
    }

    /* 輕量自然表單元件（去除粗重卡片感） */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: #b5b9cc;
      margin-bottom: 8px;
    }

    label span {
      color: #f43f5e;
      margin-left: 2px;
    }

    input, textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    input::placeholder, textarea::placeholder {
      color: #55596b;
      font-size: 0.85rem;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.5;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 免權利金優雅鋼琴音樂（乾淨直連音軌） -->
  <audio id="bg-music" loop preload="auto" src="https://cdn.freesound.org/previews/612/612642_11861866-lq.mp3"></audio>

  <!-- 頂部狀態列 -->
  <header>
    <div class="brand-block">
      <h1>THE DANCE HOUSE</h1>
      <p>舞的店 ‧ 空間洽詢</p>
    </div>

    <div class="header-ctrls">
      <div class="user-pill">
        <img id="user-avatar" class="user-avatar hidden" alt="LINE Avatar">
        <span id="user-name" class="user-name">讀取中</span>
      </div>

      <div id="music-btn" class="music-btn" onclick="toggleMusic()">
        <div class="music-bar bar-1"></div>
        <div class="music-bar bar-2"></div>
        <div class="music-bar bar-3"></div>
      </div>
    </div>
  </header>

  <!-- 1. 極簡選擇門戶（開場） -->
  <div id="portal-view">
    <div class="portal-subtitle">SELECT INQUIRY TYPE</div>
    <div class="portal-title">請選擇洽詢項目</div>

    <div class="choice-container">
      <div class="choice-card" onclick="startExperience('plan_a')">
        <div class="choice-tag">PLAN A</div>
        <h2>長期租用 / 常態班級意向</h2>
        <p>定期固定時段排練、常態授課教學、長期專案合作</p>
      </div>

      <div class="choice-card" onclick="startExperience('plan_b')">
        <div class="choice-tag">PLAN B</div>
        <h2>舞蹈教室及空間出借</h2>
        <p>單次活動、短期練習排舞、社案租借或專案攝影</p>
      </div>
    </div>
  </div>

  <!-- 2. 表單區域 -->
  <main>
    <div class="form-header-bar">
      <div>
        <div id="display-plan-tag" class="plan-tag">PLAN A</div>
        <h2 id="display-plan-title">長期租用 / 常態班級意向</h2>
      </div>
      <span class="switch-link" onclick="togglePlan()">切換方案</span>
    </div>

    <form id="inquiry-form" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="contact-name">聯絡姓名 / 稱謂<span>*</span></label>
        <input type="text" id="contact-name" required placeholder="例如：Jimmy">
      </div>

      <div class="form-group">
        <label for="contact-phone">聯絡電話<span>*</span></label>
        <input type="tel" id="contact-phone" required placeholder="例如：0910-076-252">
      </div>

      <!-- 動態欄位：Plan A 常態 -->
      <div id="field-regular" class="form-group">
        <label for="regular-schedule">預計授課 / 排練時段<span>*</span></label>
        <input type="text" id="regular-schedule" placeholder="例如：每週二 19:00 - 21:00，預計租借 3 個月">
      </div>

      <!-- 動態欄位：Plan B 教室出借 -->
      <div id="field-rental" class="form-group hidden">
        <label for="rental-detail">預計出借日期、時數與用途<span>*</span></label>
        <input type="text" id="rental-detail" placeholder="例如：10/25 (日) 下午 14:00-17:00，舞團團練">
      </div>

      <div class="form-group">
        <label for="activity-scale">活動性質 / 預估人數</label>
        <input type="text" id="activity-scale" placeholder="例如：成人國標進階班，約 8-12 人">
      </div>

      <div class="form-group">
        <label for="notes">其他備註與需求細節</label>
        <textarea id="notes" rows="3" placeholder="如有任何特殊預算考量或問題歡迎填寫"></textarea>
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">確認送出洽詢</button>
    </form>
  </main>

  <script>
    const LIFF_ID = '2011761541-H6wrNahH';
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyV6fclFzpwv5uUGWCb1GPcNrE7s6ETXmS7I-R6RUhiSBd/exec';

    let currentPlan = 'plan_a'; // 'plan_a' 或 'plan_b'
    let isMusicPlaying = false;
    let currentUser = {
      userId: '',
      displayName: '訪客',
      pictureUrl: ''
    };

    window.addEventListener('DOMContentLoaded', () => {
      initLIFF();
    });

    /* 點擊卡片進入體驗 */
    function startExperience(plan) {
      currentPlan = plan;
      renderPlanView();

      // 平滑淡出門戶
      document.getElementById('portal-view').classList.add('hidden-portal');

      // 觸發音訊播放
      playMusic();
    }

    /* 切換 Plan A / Plan B */
    function togglePlan() {
      currentPlan = (currentPlan === 'plan_a') ? 'plan_b' : 'plan_a';
      renderPlanView();
    }

    function renderPlanView() {
      const tag = document.getElementById('display-plan-tag');
      const title = document.getElementById('display-plan-title');
      const regularGroup = document.getElementById('field-regular');
      const rentalGroup = document.getElementById('field-rental');

      const regularInput = document.getElementById('regular-schedule');
      const rentalInput = document.getElementById('rental-detail');

      if (currentPlan === 'plan_a') {
        tag.textContent = 'PLAN A';
        title.textContent = '長期租用 / 常態班級意向';
        regularGroup.classList.remove('hidden');
        rentalGroup.classList.add('hidden');
        regularInput.required = true;
        rentalInput.required = false;
      } else {
        tag.textContent = 'PLAN B';
        title.textContent = '舞蹈教室及空間出借';
        regularGroup.classList.add('hidden');
        rentalGroup.classList.remove('hidden');
        regularInput.required = false;
        rentalInput.required = true;
      }
    }

    /* 音樂播放邏輯 */
    function playMusic() {
      const audio = document.getElementById('bg-music');
      const btn = document.getElementById('music-btn');
      if (!audio) return;

      audio.play().then(() => {
        isMusicPlaying = true;
        btn.classList.add('playing');
      }).catch(err => {
        console.warn('音訊自動播放被瀏覽器阻擋，需手動點擊：', err);
      });
    }

    function toggleMusic() {
      const audio = document.getElementById('bg-music');
      const btn = document.getElementById('music-btn');

      if (isMusicPlaying) {
        audio.pause();
        isMusicPlaying = false;
        btn.classList.remove('playing');
      } else {
        playMusic();
      }
    }

    /* LIFF 初始化與身分取得 */
    async function initLIFF() {
      const nameEl = document.getElementById('user-name');
      const avatarEl = document.getElementById('user-avatar');
      const nameInput = document.getElementById('contact-name');

      try {
        if (typeof liff === 'undefined') {
          nameEl.textContent = '未載入 SDK';
          return;
        }

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          nameEl.textContent = '訪客';
          return;
        }

        const profile = await liff.getProfile();
        if (profile) {
          currentUser.userId = profile.userId;
          currentUser.displayName = profile.displayName || 'LINE 好友';
          currentUser.pictureUrl = profile.pictureUrl || '';

          nameEl.textContent = currentUser.displayName;
          if (currentUser.pictureUrl) {
            avatarEl.src = currentUser.pictureUrl;
            avatarEl.classList.remove('hidden');
          }

          if (nameInput && !nameInput.value) {
            nameInput.value = currentUser.displayName;
          }
        }
      } catch (e) {
        console.error('LIFF 錯誤：', e);
        nameEl.textContent = 'LINE 訪客';
      }
    }

    /* 表單提交至 GAS */
    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '傳送中...';

      const scheduleValue = (currentPlan === 'plan_a')
        ? document.getElementById('regular-schedule').value
        : document.getElementById('rental-detail').value;

      const payload = {
        plan: (currentPlan === 'plan_a') ? '長期租用/常態班級' : '舞蹈教室及空間出借',
        lineUserId: currentUser.userId || 'guest_user',
        lineDisplayName: currentUser.displayName || '訪客',
        contactName: document.getElementById('contact-name').value,
        contactPhone: document.getElementById('contact-phone').value,
        scheduleOrDetail: scheduleValue,
        activityScale: document.getElementById('activity-scale').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert('洽詢已送出！我們將透過 LINE 或電話與您聯繫。');
        if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
          liff.closeWindow();
        }
      } catch (err) {
        console.error('傳送失敗：', err);
        alert('連線逾時，請重試或私訊粉專。');
      } finally {
        btn.disabled = false;
        btn.textContent = '確認送出洽詢';
      }
    }
  </script>
</body>
</html>
