<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>舞的店 - 教室即時空檔預約</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    /* 擬真純卡拉拉白大理石紋理 (純CSS，防破圖) */
    .marble-bg {
      background-color: #f7f8fa;
      background-image: 
        radial-gradient(at 15% 25%, rgba(195, 203, 214, 0.5) 0px, transparent 55%),
        radial-gradient(at 85% 75%, rgba(210, 215, 222, 0.55) 0px, transparent 55%),
        linear-gradient(115deg, transparent 40%, rgba(175, 185, 200, 0.35) 46%, rgba(150, 160, 175, 0.5) 48%, rgba(255, 255, 255, 0.85) 50%, transparent 54%),
        linear-gradient(245deg, transparent 60%, rgba(185, 195, 205, 0.3) 64%, rgba(165, 175, 190, 0.45) 66%, transparent 70%),
        radial-gradient(circle at 50% 50%, #ffffff 0%, #edf1f5 100%);
      background-size: 100% 100%, 100% 100%, 260px 100%, 320px 100%, 100% 100%;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

  <!-- 頂部：高質感白大理石區塊 -->
  <header class="marble-bg text-slate-800 pt-5 pb-6 px-5 shadow-sm rounded-b-3xl border-b border-slate-300/80 relative overflow-hidden">
    <!-- 香檳金流光飾條 -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200"></div>

    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="space-y-0.5">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
          <h1 class="text-xl font-black tracking-wide text-slate-900 font-serif">教室預約系統</h1>
        </div>
        <p class="text-[10px] text-slate-500 font-bold tracking-[0.22em] uppercase font-sans">
          Studio Available Slots
        </p>
      </div>

      <!-- 右側：會員實名認證狀態與點擊修改個資 -->
      <button id="open-profile-btn" class="flex items-center gap-2 bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-full border border-slate-300 shadow-sm active:scale-95 transition">
        <img id="user-avatar" src="https://via.placeholder.com/28" class="w-6 h-6 rounded-full object-cover hidden border border-slate-200">
        <div class="text-left">
          <span id="user-display" class="block text-xs font-bold text-slate-800 max-w-[90px] truncate">LINE 登錄中...</span>
          <span id="verify-badge" class="block text-[9px] text-amber-600 font-semibold">未實名認證</span>
        </div>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- 選擇教室空間（支援未來擴充） -->
    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200">
      <label class="block text-xs font-bold text-slate-400 mb-1">選擇教室空間</label>
      <select id="classroom-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">讀取教室中...</option>
      </select>
    </div>

    <!-- 週次切換與週一至週日選單 -->
    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-3 px-1">
        <button id="prev-week" class="px-3 py-1 text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-bold">← 上一週</button>
        <span id="week-range-text" class="text-xs font-black text-slate-700">-- / --</span>
        <button id="next-week" class="px-3 py-1 text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-bold">下一週 →</button>
      </div>
      <div id="weekday-tabs" class="grid grid-cols-7 gap-1 text-center"></div>
    </div>

    <!-- 時段狀態一覽（僅顯示可借用空檔） -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 id="current-date-title" class="font-extrabold text-sm text-slate-800">可借用時段一覽</h2>
        <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">僅顯示空檔</span>
      </div>
      <div id="slot-container" class="space-y-2.5">
        <p class="text-center text-slate-400 text-xs py-8">載入中...</p>
      </div>
    </div>
  </main>

  <!-- 1. 實名制登記 / 編輯彈窗 -->
  <div id="profile-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
      <div class="border-b pb-2">
        <h3 class="font-bold text-base text-slate-800">實名制身分登記</h3>
        <p class="text-xs text-slate-500 mt-1">為保障空間安全與設備使用，租借請填寫真實姓名與聯絡手機。</p>
      </div>
      <div class="space-y-3 text-xs font-bold text-slate-600">
        <div>
          <label class="block mb-1">真實姓名 <span class="text-rose-500">*</span></label>
          <input type="text" id="reg-name" placeholder="請輸入本名（如：王小明）" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block mb-1">聯絡手機 <span class="text-rose-500">*</span></label>
          <input type="tel" id="reg-phone" placeholder="例如：0912345678" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button id="close-profile-btn" class="flex-1 py-2.5 text-sm rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-600">暫時關閉</button>
        <button id="save-profile-btn" class="flex-1 py-2.5 text-sm rounded-xl bg-indigo-600 hover:bg-indigo-700 font-bold text-white shadow-md">儲存認證</button>
      </div>
    </div>
  </div>

  <!-- 2. 借用確認彈窗（個人 vs 團體包場） -->
  <div id="booking-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-base text-slate-800">確認預約時段</h3>
        <button id="close-booking-modal" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
      </div>

      <div class="text-xs space-y-1.5 text-slate-600 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
        <p><strong>空間：</strong><span id="modal-room-name">--</span></p>
        <p><strong>日期：</strong><span id="modal-date">--</span></p>
        <p><strong>時段：</strong><span id="modal-time" class="font-bold text-indigo-600">--</span></p>
        <p><strong>承租人：</strong><span id="modal-user-info" class="font-bold text-slate-800">--</span></p>
      </div>

      <!-- 租借型態單選按鈕 -->
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1.5">租借型態 <span class="text-rose-500">*</span></label>
        <div class="grid grid-cols-2 gap-2 text-xs font-bold">
          <label class="flex items-center justify-center p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-600 has-[:checked]:bg-indigo-50">
            <input type="radio" name="booking-type" value="個人練習" checked class="hidden">
            <span>👤 個人自主練習</span>
          </label>
          <label class="flex items-center justify-center p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-600 has-[:checked]:bg-indigo-50">
            <input type="radio" name="booking-type" value="團體包場" class="hidden">
            <span>👥 團體/開課包場</span>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">使用用途 / 舞風備註（選填）</label>
        <input type="text" id="booking-purpose" placeholder="例如：自主練習、舞展排練" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div class="flex gap-2 pt-1">
        <button id="cancel-booking-btn" class="flex-1 py-2.5 text-sm rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-600">取消</button>
        <button id="submit-booking-btn" class="flex-1 py-2.5 text-sm rounded-xl bg-indigo-600 hover:bg-indigo-700 font-bold text-white shadow-md">確認預約</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 請替換為您的環境資訊：
    // =========================================================================
    const LIFF_ID = '2011761541-hL5HCl1Q'; // 填入 LINE Developers 的 LIFF ID
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyImSgZWu7YAcTO5I8uJf0BggB6cx8Obji_rx4lh8OqTBm83k-nVH8lLqLnxrUUrkD6Pw/exec'; // 填入 Apps Script 部署後的 Web App 網址

    let currentUser = {
      userId: 'guest_user',
      lineName: '訪客',
      pictureUrl: '',
      realName: '',
      phone: '',
      isRegistered: false
    };

    let classrooms = [];
    let selectedRoomId = null;
    let currentMonday = getMonday(new Date());
    let selectedDate = formatDate(new Date());

    // 10:00 至 23:00 時段劃分（每小時一檔）
    const TIME_SLOTS = [
      { start: '10:00', end: '11:00' },
      { start: '11:00', end: '12:00' },
      { start: '12:00', end: '13:00' },
      { start: '13:00', end: '14:00' },
      { start: '14:00', end: '15:00' },
      { start: '15:00', end: '16:00' },
      { start: '16:00', end: '17:00' },
      { start: '17:00', end: '18:00' },
      { start: '18:00', end: '19:00' },
      { start: '19:00', end: '20:00' },
      { start: '20:00', end: '21:00' },
      { start: '21:00', end: '22:00' },
      { start: '22:00', end: '23:00' }
    ];

    window.addEventListener('DOMContentLoaded', async () => {
      await initLiffAuth();
      await fetchClassrooms();
      renderWeekdayTabs();
      await fetchAndRenderSlots();
      bindEvents();
    });

    // 1. LIFF 初始化與實名驗證檢查
    async function initLiffAuth() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        currentUser.userId = profile.userId;
        currentUser.lineName = profile.displayName;
        currentUser.pictureUrl = profile.pictureUrl;

        document.getElementById('user-display').textContent = profile.displayName;
        if (profile.pictureUrl) {
          const img = document.getElementById('user-avatar');
          img.src = profile.pictureUrl;
          img.classList.remove('hidden');
        }

        // 查詢 Google Sheets members 表
        const res = await fetch(`${GAS_API_URL}?action=checkMember&lineUserId=${profile.userId}`);
        const data = await res.json();

        if (data.registered) {
          currentUser.isRegistered = true;
          currentUser.realName = data.real_name;
          currentUser.phone = data.phone;
          document.getElementById('user-display').textContent = data.real_name;
          document.getElementById('verify-badge').textContent = '已實名認證';
          document.getElementById('verify-badge').className = 'block text-[9px] text-emerald-600 font-semibold';
        } else {
          // 首次未註冊主動提示登記
          openProfileModal();
        }
      } catch (err) {
        console.warn('非 LINE 容器環境或 LIFF 尚未啟動：', err);
        document.getElementById('user-display').textContent = '本機訪客';
      }
    }

    function openProfileModal() {
      document.getElementById('reg-name').value = currentUser.realName || '';
      document.getElementById('reg-phone').value = currentUser.phone || '';
      document.getElementById('profile-modal').classList.remove('hidden');
    }

    async function saveProfile() {
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();

      if (!name || !phone) {
        alert('請完整輸入姓名與聯絡電話！');
        return;
      }

      const saveBtn = document.getElementById('save-profile-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = '認證中...';

      try {
        const payload = {
          action: 'registerMember',
          line_user_id: currentUser.userId,
          line_name: currentUser.lineName,
          real_name: name,
          phone: phone
        };

        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          currentUser.realName = name;
          currentUser.phone = phone;
          currentUser.isRegistered = true;
          document.getElementById('user-display').textContent = name;
          document.getElementById('verify-badge').textContent = '已實名認證';
          document.getElementById('verify-badge').className = 'block text-[9px] text-emerald-600 font-semibold';
          alert('實名制登記成功！');
          document.getElementById('profile-modal').classList.add('hidden');
        } else {
          throw new Error(result.error);
        }
      } catch (e) {
        alert('儲存失敗：' + e.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存認證';
      }
    }

    // 2. 教室空間讀取
    async function fetchClassrooms() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getClassrooms`);
        const data = await res.json();
        const select = document.getElementById('classroom-select');
        select.innerHTML = '';

        if (!data || data.length === 0) {
          select.innerHTML = '<option value="">無開放教室</option>';
          return;
        }
        classrooms = data;
        selectedRoomId = classrooms[0].id;
        data.forEach(room => {
          const opt = document.createElement('option');
          opt.value = room.id;
          opt.textContent = room.name;
          select.appendChild(opt);
        });
      } catch (e) {
        console.error('讀取教室失敗：', e);
      }
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function renderWeekdayTabs() {
      const container = document.getElementById('weekday-tabs');
      container.innerHTML = '';
      const dayLabels = ['一', '二', '三', '四', '五', '六', '日'];

      const endSunday = new Date(currentMonday);
      endSunday.setDate(endSunday.getDate() + 6);
      document.getElementById('week-range-text').textContent = 
        `${currentMonday.getMonth() + 1}/${currentMonday.getDate()} - ${endSunday.getMonth() + 1}/${endSunday.getDate()}`;

      for (let i = 0; i < 7; i++) {
        const loopDate = new Date(currentMonday);
        loopDate.setDate(loopDate.getDate() + i);
        const loopDateStr = formatDate(loopDate);
        const isSelected = (loopDateStr === selectedDate);

        const tab = document.createElement('button');
        tab.className = `p-2 rounded-xl flex flex-col items-center justify-center transition-all ${
          isSelected ? 'bg-indigo-600 text-white font-bold shadow-md' : 'bg-slate-50 hover:bg-slate-100 text-slate-700'
        }`;
        tab.innerHTML = `
          <span class="text-[11px] font-medium">週${dayLabels[i]}</span>
          <span class="text-xs mt-0.5 font-bold">${loopDate.getDate()}</span>
        `;
        tab.onclick = () => {
          selectedDate = loopDateStr;
          renderWeekdayTabs();
          fetchAndRenderSlots();
        };
        container.appendChild(tab);
      }
    }

    // 3. 渲染時段：過濾佔用時段，僅顯示空檔
    async function fetchAndRenderSlots() {
      const container = document.getElementById('slot-container');
      container.innerHTML = '<p class="text-center text-slate-400 text-xs py-8">更新狀態中...</p>';
      document.getElementById('current-date-title').textContent = `${selectedDate} 可借用時段`;

      if (!selectedRoomId) return;

      const dateObj = new Date(selectedDate);
      const dayOfWeek = dateObj.getDay() === 0 ? 7 : dateObj.getDay();

      try {
        const res = await fetch(`${GAS_API_URL}?action=getSchedule&roomId=${selectedRoomId}&date=${selectedDate}&dayOfWeek=${dayOfWeek}`);
        const data = await res.json();
        const bookings = data.bookings || [];
        const recurrings = data.recurrings || [];

        container.innerHTML = '';

        // 僅保留未被佔用的時段
        const availableSlots = TIME_SLOTS.filter(slot => {
          const isBooked = bookings.some(b => slot.start >= b.start_time && slot.start < b.end_time);
          const isRecurring = recurrings.some(r => slot.start >= r.start_time && slot.start < r.end_time);
          return !isBooked && !isRecurring;
        });

        // 當日全滿的提示
        if (availableSlots.length === 0) {
          container.innerHTML = `
            <div class="text-center py-10 bg-slate-50 rounded-xl border border-dashed border-slate-200">
              <p class="text-sm font-bold text-slate-400">本日所有時段皆已被借用</p>
              <p class="text-xs text-slate-400 mt-1">請點選上方其他日期查看空檔</p>
            </div>
          `;
          return;
        }

        // 渲染純可借用按鈕
        availableSlots.forEach(slot => {
          const slotCard = document.createElement('div');
          slotCard.className = 'flex items-center justify-between p-3.5 rounded-xl border border-emerald-200 bg-white hover:border-emerald-400 hover:shadow-sm transition cursor-pointer';
          slotCard.innerHTML = `
            <div class="flex items-center space-x-2">
              <span class="font-extrabold text-slate-800 text-sm">${slot.start} - ${slot.end}</span>
              <span class="text-xs px-2 py-0.5 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-md font-bold">可借用</span>
            </div>
            <button class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3.5 py-1.5 rounded-lg shadow-sm">借用</button>
          `;
          slotCard.onclick = () => openBookingModal(slot);
          container.appendChild(slotCard);
        });
      } catch (err) {
        container.innerHTML = '<p class="text-center text-red-500 text-xs py-8">讀取資料失敗，請稍後再試</p>';
      }
    }

    // 4. 預約對話框與送出
    let targetSlot = null;

    function openBookingModal(slot) {
      if (!currentUser.isRegistered) {
        alert('請先完成實名制登記才能進行預約！');
        openProfileModal();
        return;
      }

      targetSlot = slot;
      const room = classrooms.find(r => String(r.id) === String(selectedRoomId));
      document.getElementById('modal-room-name').textContent = room ? room.name : '--';
      document.getElementById('modal-date').textContent = selectedDate;
      document.getElementById('modal-time').textContent = `${slot.start} - ${slot.end}`;
      document.getElementById('modal-user-info').textContent = `${currentUser.realName} (${currentUser.phone})`;
      document.getElementById('booking-purpose').value = '';
      document.getElementById('booking-modal').classList.remove('hidden');
    }

    async function submitBooking() {
      if (!targetSlot) return;

      const bookingType = document.querySelector('input[name="booking-type"]:checked').value;
      const purpose = document.getElementById('booking-purpose').value.trim() || bookingType;
      const submitBtn = document.getElementById('submit-booking-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = '預約中...';

      try {
        const payload = {
          action: 'createBooking',
          classroom_id: selectedRoomId,
          line_user_id: currentUser.userId,
          user_name: currentUser.realName,
          phone: currentUser.phone,
          booking_type: bookingType,
          booking_date: selectedDate,
          start_time: targetSlot.start,
          end_time: targetSlot.end,
          purpose: purpose
        };

        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert(`【${bookingType}】預約成功！時段已為您保留。`);
          document.getElementById('booking-modal').classList.add('hidden');
          await fetchAndRenderSlots();
        } else {
          throw new Error(result.error);
        }
      } catch (err) {
        alert('預約失敗：' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '確認預約';
      }
    }

    function bindEvents() {
      document.getElementById('open-profile-btn').addEventListener('click', openProfileModal);
      document.getElementById('close-profile-btn').addEventListener('click', () => {
        document.getElementById('profile-modal').classList.add('hidden');
      });
      document.getElementById('save-profile-btn').addEventListener('click', saveProfile);

      document.getElementById('classroom-select').addEventListener('change', (e) => {
        selectedRoomId = e.target.value;
        fetchAndRenderSlots();
      });

      document.getElementById('prev-week').addEventListener('click', () => {
        currentMonday.setDate(currentMonday.getDate() - 7);
        selectedDate = formatDate(currentMonday);
        renderWeekdayTabs();
        fetchAndRenderSlots();
      });

      document.getElementById('next-week').addEventListener('click', () => {
        currentMonday.setDate(currentMonday.getDate() + 7);
        selectedDate = formatDate(currentMonday);
        renderWeekdayTabs();
        fetchAndRenderSlots();
      });

      document.getElementById('close-booking-modal').addEventListener('click', () => {
        document.getElementById('booking-modal').classList.add('hidden');
      });
      document.getElementById('cancel-booking-btn').addEventListener('click', () => {
        document.getElementById('booking-modal').classList.add('hidden');
      });
      document.getElementById('submit-booking-btn').addEventListener('click', submitBooking);
    }
  </script>
</body>
