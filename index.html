<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教室即時課表與租借</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <header class="bg-indigo-600 text-white p-4 shadow sticky top-0 z-10 flex justify-between items-center">
    <h1 class="text-base font-bold">教室租借系統</h1>
    <span id="user-name" class="text-xs text-indigo-100">載入中...</span>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- 選擇教室 -->
    <div class="bg-white p-3 rounded-xl shadow-sm border">
      <label class="block text-xs font-semibold text-slate-500 mb-1">選擇教室</label>
      <select id="classroom-select" class="w-full bg-slate-50 border rounded-lg p-2 text-sm"></select>
    </div>

    <!-- 週一至週日切換 -->
    <div class="bg-white p-3 rounded-xl shadow-sm border">
      <div class="flex justify-between items-center mb-2">
        <button id="prev-week" class="px-2 py-1 text-xs bg-slate-100 rounded">← 上一週</button>
        <span id="week-text" class="text-xs font-bold text-slate-600"></span>
        <button id="next-week" class="px-2 py-1 text-xs bg-slate-100 rounded">下一週 →</button>
      </div>
      <div id="weekday-tabs" class="grid grid-cols-7 gap-1 text-center"></div>
    </div>

    <!-- 即時時段 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border">
      <h2 id="date-title" class="font-bold text-sm text-slate-700 mb-3">課表與時段狀態</h2>
      <div id="slot-list" class="space-y-2"></div>
    </div>
  </main>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbw3axiV2orJCqeO1ej-0xnFamrfyWm0YljUysz6tVW-huHjVwZFx0kHzcyCZV2oTjTseQ/exec';
    const LIFF_ID = '2011761541-hL5HCl1Q';

    let currentMonday = getMonday(new Date());
    let selectedDate = formatDate(new Date());
    let selectedRoom = '';
    let userProfile = { userId: '', displayName: '訪客' };

    const TIME_SLOTS = [
      { start: '09:00', end: '10:00' }, { start: '10:00', end: '11:00' },
      { start: '13:00', end: '14:00' }, { start: '14:00', end: '15:00' },
      { start: '15:00', end: '16:00' }, { start: '18:00', end: '19:00' },
      { start: '19:00', end: '20:00' }, { start: '20:00', end: '21:00' }
    ];

    window.addEventListener('DOMContentLoaded', async () => {
      // 1. 初始化 LIFF
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          userProfile = await liff.getProfile();
          document.getElementById('user-name').textContent = userProfile.displayName;
        }
      } catch (e) {
        document.getElementById('user-name').textContent = '測試訪客';
      }

      // 2. 取得教室清單
      const res = await fetch(`${GAS_API_URL}?action=getClassrooms`);
      const rooms = await res.json();
      const select = document.getElementById('classroom-select');
      rooms.forEach((r, idx) => {
        const opt = document.createElement('option');
        opt.value = r.name;
        opt.textContent = `${r.name} (可容納 ${r.capacity} 人)`;
        select.appendChild(opt);
        if (idx === 0) selectedRoom = r.name;
      });

      renderWeek();
      loadSlots();

      select.addEventListener('change', (e) => {
        selectedRoom = e.target.value;
        loadSlots();
      });
      document.getElementById('prev-week').onclick = () => { currentMonday.setDate(currentMonday.getDate() - 7); renderWeek(); loadSlots(); };
      document.getElementById('next-week').onclick = () => { currentMonday.setDate(currentMonday.getDate() + 7); renderWeek(); loadSlots(); };
    });

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function formatDate(d) {
      return d.toISOString().split('T')[0];
    }

    function renderWeek() {
      const container = document.getElementById('weekday-tabs');
      container.innerHTML = '';
      const days = ['一', '二', '三', '四', '五', '六', '日'];
      for (let i = 0; i < 7; i++) {
        const d = new Date(currentMonday);
        d.setDate(d.getDate() + i);
        const dStr = formatDate(d);
        const isSelected = (dStr === selectedDate);
        const btn = document.createElement('button');
        btn.className = `p-2 rounded-lg text-xs flex flex-col items-center ${isSelected ? 'bg-indigo-600 text-white font-bold' : 'bg-slate-100 text-slate-700'}`;
        btn.innerHTML = `<span>週${days[i]}</span><span class="mt-0.5">${d.getDate()}</span>`;
        btn.onclick = () => { selectedDate = dStr; renderWeek(); loadSlots(); };
        container.appendChild(btn);
      }
    }

    async function loadSlots() {
      const list = document.getElementById('slot-list');
      list.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">讀取中...</p>';
      document.getElementById('date-title').textContent = `${selectedRoom} - ${selectedDate} 狀態`;

      const res = await fetch(`${GAS_API_URL}?action=getBookings&roomName=${encodeURIComponent(selectedRoom)}&date=${selectedDate}`);
      const bookings = await res.json();

      list.innerHTML = '';
      TIME_SLOTS.forEach(slot => {
        const occupied = bookings.find(b => slot.start >= b.startTime && slot.start < b.endTime);
        const item = document.createElement('div');
        item.className = 'flex justify-between items-center p-3 border rounded-lg text-sm';

        if (occupied) {
          item.classList.add('bg-slate-100', 'text-slate-400');
          item.innerHTML = `<span>${slot.start} - ${slot.end}</span><span class="text-xs bg-slate-200 px-2 py-0.5 rounded text-slate-600">已借出 (${occupied.purpose})</span>`;
        } else {
          item.classList.add('bg-white', 'text-slate-700');
          item.innerHTML = `<span>${slot.start} - ${slot.end}</span><button class="text-xs bg-indigo-600 text-white px-3 py-1 rounded font-bold hover:bg-indigo-700">借用</button>`;
          item.querySelector('button').onclick = () => bookSlot(slot);
        }
        list.appendChild(item);
      });
    }

    async function bookSlot(slot) {
      const purpose = prompt(`確認預約 ${selectedRoom} [${selectedDate} ${slot.start}-${slot.end}]？\n請輸入借用用途：`, '自主練習');
      if (!purpose) return;

      const payload = {
        roomName: selectedRoom,
        bookingDate: selectedDate,
        startTime: slot.start,
        endTime: slot.end,
        userName: userProfile.displayName,
        userId: userProfile.userId,
        purpose: purpose
      };

      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await res.json();

      if (result.success) {
        alert('預約成功！');
        loadSlots();
      } else {
        alert('預約失敗：' + result.message);
      }
    }
  </script>
</body>
</html>
